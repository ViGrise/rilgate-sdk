[package]
name = "rilgate-client-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
cli = ["uniffi/cli"]

[dependencies]
rilgate-client = { path = "../rilgate-client" }
uniffi = "0.29"
thiserror = "2"

[[bin]]
name = "uniffi-bindgen"
required-features = ["cli"]
